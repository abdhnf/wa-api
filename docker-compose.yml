services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wa-api-backend
    restart: unless-stopped
    environment:
      - PORT=3100
      - HOST=0.0.0.0
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-please_change_this_jwt_secret_hex_key_32_chars}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - DB_PATH=/app/data/wa.db
      - SESSIONS_DIR=/app/data/auth
    volumes:
      # Persistent storage untuk database SQLite dan token sesi WhatsApp
      - ./data:/app/data
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3

  panel:
    build:
      context: ./panel
      dockerfile: Dockerfile
    container_name: wa-api-panel
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Buka port 5174 (atau ganti ke 80 jika ingin langsung tanpa proxy)
      - "5174:80"

volumes:
  data:
